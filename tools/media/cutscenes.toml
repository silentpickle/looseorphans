# Every cutscene: uv run python -m tools.media cutscenes (dry run) / --run. One Gemini Omni image-to-video call per
# clip, with the still as the first frame. A clip already under web/public/assets/video/ is never regenerated;
# delete its .webm and .mp4 to redo the pixel pass and its raw MP4 under .cache/media/video/ to animate it again
# (that spends). The still defaults to web/public/assets/art/stills/<id>.png; a clip whose still is not drawn yet is
# reported and skipped. `still` overrides the path (relative to web/public/assets/art/). seconds is 3..10;
# every clip is 6 s (about $0.63) so the whole set stays inside the $10 media total in config.toml.
# Prompts describe camera, motion and light only: never a real person's name or a show title.

[[clip]]
id = "sample_ongsang"
group = "sample"
still = "backdrops/ongsang_street.png"
seconds = 6
prompt = "Camera slowly pushes in, red camellia petals drift across a seaside street, warm afternoon light, gentle waves along the harbour wall."

[[clip]]
id = "shatter"
group = "prologue"
seconds = 6
prompt = "The glowing golden dome cracks further and bursts into shards that fly outward, purple lightning flashes, the figure in the black suit raises his hand as the eight young men in hoodies are pushed back across the rooftop, slow motion, a slight camera shake."

[[clip]]
id = "declaration"

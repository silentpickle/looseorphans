seconds = 6
prompt = "The police officer calls out with his arms wide as small red hearts pulse and float up around him, the woman in the apron hides her blushing face, the two older women in the doorway whisper to each other, red camellia petals drift, sunset light, the camera slowly pushes in."

[[clip]]

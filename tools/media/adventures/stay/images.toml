# The L-Team's Nano Banana pictures (adventure "stay"): uv run python -m tools.media image --adventure stay (dry run).
# The crew in their onesies, redrawn from each member's portrait in the first game so the faces stay the same.
# A picture already on disk is never redrawn. No real names in a prompt; the onesies are generic plush animals.

[[image]]
id = "stay_m1"
group = "portraits"
prompt = "Redraw this exact character as a pixel art portrait bust in the same style, same face and hair: a cute young Korean man with fluffy black hair and round cheeks, wearing a brown plush quokka onesie with the hood up, small round ears on the hood. JRPG dialogue portrait, facing slightly left, clean 16-bit pixel art."
width = 128
height = 128
references = ["web/public/assets/art/portraits/m1.png"]
key = "#00ff00"


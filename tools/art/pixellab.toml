# Every PixelLab picture: uv run python -m tools.art pictures (dry run) / --run. One picture per piece.
# A piece already under web/public/assets/art/<group>/ is never redrawn; delete its PNG to draw it again.
# Never a real person's name or a show title in a prompt.
#
# Groups: backdrops (map screens, high top-down, floor in the lower two thirds, empty of people and props),
# battles (side view battle backgrounds), stills (the K-drama trope moments), portraits (128 busts),
# bosses, enemies, companions (pets), props, title. Every prompt ends with the same style tail.


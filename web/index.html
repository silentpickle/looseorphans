<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Loose Orphans</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
      }
      /* Upright phones get a nudge to turn sideways; the game still plays either way. */
      #turn {
        display: none;
        position: fixed;
        inset: 0 0 auto;
        padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
        text-align: center;
        font:
          600 15px/1.4 "Courier New",
          monospace;
        color: #fff;
        opacity: 0.8;
        pointer-events: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #turn {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="turn">Turn your phone sideways to play</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
